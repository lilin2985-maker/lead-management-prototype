    function saveFollow() {
      const textarea = document.getElementById("followContent");
      const content = textarea.value.trim();
      const followType = document.getElementById("followType")?.value || state.modal.followType || "需求沟通中";
      if (followType !== "转商机" && !content) {
        textarea.focus();
        toast("请输入跟进内容");
        return;
      }
      if (!state.drawer) return;
      const entityId = state.drawer.id;
      if (!followRecords[entityId]) followRecords[entityId] = [];
      const convertFields = {
        contact: document.getElementById("followContact")?.value.trim() || "",
        category: document.getElementById("followCategory")?.value.trim() || "",
        demand: document.getElementById("followDemand")?.value.trim() || "",
        groupBuilt: document.getElementById("followGroupBuilt")?.value || "否",
        intent: document.getElementById("followIntent")?.value || "中"
      };
      if (followType === "转商机" && Object.entries(convertFields).some(([key, value]) => ["contact", "demand"].includes(key) && !value)) {
        toast("请补充联系人和客户反馈");
        return;
      }
      const shouldReturnSea = followType === "无合作意向"
        && state.drawer.type === "lead"
        && document.getElementById("followReturnSea")?.value === "是";

      if (state.modal.mode === "edit") {
        const record = followRecords[entityId].find(item => item.id === state.modal.record.id);
        if (record) {
          record.content = content;
          record.type = followType;
          Object.assign(record, convertFields);
          record.time = "2026-10-12 17:15:00";
        }
        toast("跟进记录已更新");
      } else {
        followRecords[entityId].unshift({
          id: `F${Date.now()}`,
          author: CURRENT_USER,
          time: "2026-10-12 17:15:00",
          content,
          type: followType,
          ...convertFields
        });
        toast("跟进记录已新增");
      }
      closeModal();
      if (shouldReturnSea) {
        const lead = leads.find(item => item.id === entityId);
        if (lead) {
          lead.returnCount = Number(lead.returnCount || 0) + 1;
          lead.status = lead.returnCount >= 2 ? "invalid" : "pool";
          lead.sales = "";
        }
        closeDrawer();
        renderAll();
        toast("已记录无合作意向，并将线索退回公海");
      } else {
        renderDrawer();
      }
    }

    function deleteFollow() {
      if (!state.drawer) return;
      const entityId = state.drawer.id;
      const recordId = state.modal.record.id;
      const record = (followRecords[entityId] || []).find(item => item.id === recordId);
      if (!record || record.author !== CURRENT_USER) {
        closeModal();
        toast("仅记录人可删除跟进记录");
        return;
      }
      followRecords[entityId] = followRecords[entityId].filter(item => item.id !== recordId);
      closeModal();
      state.followMenu = null;
      renderDrawer();
      toast("跟进记录已删除");
    }

    function updateSelection(scope, id, checked) {
      const set = state.selection[scope];
      if (checked) set.add(id);
      else set.delete(id);
      renderAll();
    }

    function selectAll(scope, checked) {
      const rows = scope === "sea" ? getSeaRows() : scope === "lead" ? getLeadRows() : getOppRows();
      state.selection[scope] = new Set(checked ? rows.map(row => row.id) : []);
      renderAll();
    }

    document.addEventListener("click", async event => {
      const actionTarget = event.target.closest("[data-action]");
      const viewTarget = event.target.closest("[data-view]");
      const roleTarget = event.target.closest("[data-role]");

      if (viewTarget) {
        navigate(viewTarget.dataset.view);
        document.getElementById("sidebar").classList.remove("open");
        document.getElementById("mobileScrim").classList.remove("open");
        return;
      }

      if (roleTarget) {
        state.role = roleTarget.dataset.role;
        document.querySelectorAll("[data-role]").forEach(button => button.classList.toggle("active", button.dataset.role === state.role));
        document.getElementById("sidebarRole").textContent = state.role === "manager" ? "电销主管" : "电销员";
        state.selection.lead.clear();
        renderAll();
        toast(state.role === "manager" ? "已切换至电销主管视角" : "已切换至电销员视角");
        return;
      }

      if (!actionTarget) {
        if (!event.target.closest(".tag-picker")) {
          document.querySelectorAll(".tag-picker.open").forEach(picker => {
            picker.classList.remove("open");
            picker.querySelector(".tag-picker-trigger")?.setAttribute("aria-expanded", "false");
          });
        }
        if (state.regionPickerScope && !event.target.closest(".region-picker")) {
          state.regionPickerScope = null;
          ["sea", "lead", "opp"].forEach(renderRegionFilters);
        }
        if (!event.target.closest(".column-panel") && state.columnPanelScope) {
          state.columnPanelScope = null;
          renderColumnPanel();
        }
        if (state.followMenu && !event.target.closest(".more-wrap")) {
          state.followMenu = null;
          renderDrawer();
        }
        return;
      }

      const action = actionTarget.dataset.action;
      if (action === "toggle-tag-picker") {
        const picker = actionTarget.closest(".tag-picker");
        const open = !picker.classList.contains("open");
        picker.classList.toggle("open", open);
        actionTarget.setAttribute("aria-expanded", String(open));
        if (open) picker.querySelector('[data-action="tag-search"]')?.focus();
        return;
      }
      if (action === "toggle-region-picker") {
        const scope = actionTarget.dataset.scope;
        state.regionPickerScope = state.regionPickerScope === scope ? null : scope;
        ["sea", "lead", "opp"].forEach(renderRegionFilters);
        return;
      }
      if (action === "select-region") {
        selectRegion(actionTarget.dataset.scope, actionTarget.dataset.level, actionTarget.dataset.value);
        return;
      }
      if (action === "clear-region") {
        const scope = actionTarget.dataset.scope;
        state.filters[scope].province = "";
        state.filters[scope].city = "";
        state.filters[scope].district = "";
        state.regionPickerScope = scope;
        renderRegionFilters(scope);
        return;
      }
      if (action === "close-region-picker") {
        state.regionPickerScope = null;
        ["sea", "lead", "opp"].forEach(renderRegionFilters);
        return;
      }
      if (action === "switch-list-tab") {
        const scope = actionTarget.dataset.scope;
        state.listTabs[scope] = actionTarget.dataset.tab;
        if (scope === "sea" && actionTarget.dataset.tab !== "assigned") {
          state.filters.sea.sales = "";
          const salesFilter = document.getElementById("seaSales");
          if (salesFilter) salesFilter.value = "";
        }
        state.selection[scope].clear();
        renderAll();
        return;
      }
      if (action === "toggle-nav") {
        document.getElementById("lineNav").classList.toggle("open");
        document.getElementById("lineChildren").classList.toggle("open");
      }
      if (action === "open-sidebar") {
        document.getElementById("sidebar").classList.add("open");
        document.getElementById("mobileScrim").classList.add("open");
      }
      if (action === "close-sidebar") {
        document.getElementById("sidebar").classList.remove("open");
        document.getElementById("mobileScrim").classList.remove("open");
      }
      if (action === "copy-phone") {
        try {
          await navigator.clipboard.writeText(actionTarget.dataset.phone);
        } catch (error) {
          const helper = document.createElement("textarea");
          helper.value = actionTarget.dataset.phone;
          document.body.appendChild(helper);
          helper.select();
          document.execCommand("copy");
          helper.remove();
        }
        toast("复制成功");
      }
      if (action === "open-lead-drawer") openDrawer("lead", actionTarget.dataset.id);
      if (action === "open-opp-drawer") openDrawer("opp", actionTarget.dataset.id);
      if (action === "start-detail-edit") {
        const record = state.drawer?.type === "opp"
          ? opportunities.find(item => item.id === state.drawer.id)
          : leads.find(item => item.id === state.drawer?.id);
        if (record) startDetailEdit(record, state.drawer.type === "lead");
      }
      if (action === "cancel-detail-edit") cancelDetailEdit();
      if (action === "save-detail-edit") saveDetailEdit();
      if (action === "open-detail-phone") {
        if (!state.drawer) return;
        state.detailPhoneDraft = { type: state.drawer.type, id: state.drawer.id };
        renderDrawer();
        document.getElementById("detailExtraPhoneInput")?.focus();
      }
      if (action === "commit-detail-phone") {
        const input = document.getElementById("detailExtraPhoneInput");
        const phone = input?.value.trim() || "";
        if (!phone) {
          input?.focus();
          toast("请输入联系电话");
        } else {
          const record = state.drawer?.type === "opp"
            ? opportunities.find(item => item.id === state.drawer.id)
            : leads.find(item => item.id === state.drawer?.id);
          if (record) {
            record.extraPhones = [...(record.extraPhones || []), phone];
            state.detailPhoneDraft = null;
            renderAll();
            renderDrawer();
            toast("联系电话已新增");
          }
        }
      }
      if (action === "delete-detail-phone") {
        const index = Number(actionTarget.dataset.index);
        const record = state.drawer?.type === "opp"
          ? opportunities.find(item => item.id === state.drawer.id)
          : leads.find(item => item.id === state.drawer?.id);
        if (record?.extraPhones?.[index] !== undefined) {
          record.extraPhones.splice(index, 1);
          state.detailPhoneDraft = null;
          renderAll();
          renderDrawer();
          toast("联系电话已删除");
        }
      }
      if (action === "edit-record") openEdit(actionTarget.dataset.entity, actionTarget.dataset.id);
      if (action === "edit-tag-toggle") {
        const tag = actionTarget.dataset.tag;
        const tags = state.modal?.tags || [];
        state.modal.tags = tags.includes(tag) ? tags.filter(item => item !== tag) : [...tags, tag];
        actionTarget.classList.toggle("active", state.modal.tags.includes(tag));
      }
      if (action === "add-extra-phone") {
        const input = document.getElementById("extraPhoneInput");
        const phone = input?.value.trim() || "";
        if (!phone) {
          toast("请输入联系电话");
        } else {
          state.modal.extraPhones = [...(state.modal.extraPhones || []), phone];
          renderModal();
        }
      }
      if (action === "add-edit-phone") {
        if (actionTarget.dataset.mode === "open") {
          state.modal.phoneDraftOpen = true;
          renderModal();
          document.getElementById("extraPhoneInput")?.focus();
        } else {
          const input = document.getElementById("extraPhoneInput");
          const phone = input?.value.trim() || "";
          if (!phone) {
            input?.focus();
            toast("请输入联系电话");
          } else {
            state.modal.extraPhones = [...(state.modal.extraPhones || []), phone];
            state.modal.phoneDraftOpen = true;
            renderModal();
            document.getElementById("extraPhoneInput")?.focus();
          }
        }
      }
      if (action === "add-convert-phone") {
        if (actionTarget.dataset.mode === "open") {
          state.modal.phoneDraftOpen = true;
          renderModal();
          document.getElementById("convertExtraPhoneInput")?.focus();
        } else {
          const input = document.getElementById("convertExtraPhoneInput");
          const phone = input?.value.trim() || "";
          if (!phone) {
            input?.focus();
            toast("请输入联系电话");
          } else {
            state.modal.extraPhones = [...(state.modal.extraPhones || []), phone];
            state.modal.phoneDraftOpen = true;
            renderModal();
            document.getElementById("convertExtraPhoneInput")?.focus();
          }
        }
      }
      if (action === "close-drawer") closeDrawer();
      if (action === "batch-assign") {
        const scope = actionTarget.dataset.scope || "lead";
        const ids = [...state.selection[scope]];
        if (!ids.length) {
          toast("请先选择需要批量分配的线索");
        } else {
          openAssign(ids, "batch", scope);
        }
      }
      if (action === "assign") openAssign(actionTarget.dataset.id, actionTarget.dataset.source || "sea");
      if (action === "return-sea") openModal("return", { id: actionTarget.dataset.id });
      if (action === "convert") openModal("convert", { id: actionTarget.dataset.id });
      if (action === "close-modal") closeModal();
      if (action === "confirm-assign") {
        const selected = document.querySelector('input[name="assignee"]:checked')?.value || "";
        confirmAssign(selected);
      }
      if (action === "confirm-return") confirmReturn();
      if (action === "add-follow") openModal("follow", { mode: "add" });
      if (action === "follow-menu") {
        state.followMenu = state.followMenu === actionTarget.dataset.id ? null : actionTarget.dataset.id;
        renderDrawer();
      }
      if (action === "edit-follow") {
        const record = (followRecords[state.drawer.id] || []).find(item => item.id === actionTarget.dataset.id);
        if (record?.author === CURRENT_USER) openModal("follow", { mode: "edit", record });
        else toast("仅记录人可编辑跟进记录");
      }
      if (action === "delete-follow") {
        const record = (followRecords[state.drawer.id] || []).find(item => item.id === actionTarget.dataset.id);
        if (record?.author === CURRENT_USER) openModal("delete-follow", { record });
        else toast("仅记录人可删除跟进记录");
      }
      if (action === "save-follow") saveFollow();
      if (action === "confirm-delete-follow") deleteFollow();
      if (action === "toggle-columns") {
        const scope = actionTarget.dataset.scope;
        state.columnPanelScope = state.columnPanelScope === scope ? null : scope;
        renderColumnPanel();
      }
      if (action === "toggle-more-filters") {
        const scope = actionTarget.dataset.scope;
        const form = document.getElementById(`${scope}FilterForm`);
        const expanded = form.classList.toggle("expanded");
        actionTarget.setAttribute("aria-expanded", String(expanded));
        const label = actionTarget.querySelector("strong");
        if (label) label.textContent = expanded ? "收起" : "展开全部";
      }
      if (action === "export") exportScope(actionTarget.dataset.scope);
      if (action === "new-opportunity") openModal("new-opp");
      if (action === "import-opportunities") openModal("import-opp");
      if (action === "show-invalid-help") openModal("invalid-help");
      if (action === "sort-column") {
        const scope = actionTarget.dataset.scope;
        const key = actionTarget.dataset.key;
        const current = state.sortStates[scope];
        const direction = current.key === key && current.direction === "asc" ? "desc" : "asc";
        state.sortStates[scope] = { key, direction };
        renderConfigurableTable(scope);
      }
      if (action === "confirm-import-opp") {
        const file = document.getElementById("importOppFile")?.files?.[0];
        if (!file) {
          toast("请先选择导入文件");
        } else {
          closeModal();
          toast(`已导入文件：${file.name}`);
        }
      }
      if (action === "column-option") {
        const { value } = actionTarget;
        const scope = actionTarget.dataset.scope;
        if (actionTarget.checked) state.visibleColumns[scope].add(value);
        else state.visibleColumns[scope].delete(value);
        renderConfigurableTable(scope);
        renderColumnPanel();
      }
      if (action === "select-row") {
        event.stopPropagation();
        updateSelection(actionTarget.dataset.scope, actionTarget.dataset.id, actionTarget.checked);
      }
    });

    document.addEventListener("change", event => {
      const scope = event.target.dataset.filterScope;
      const key = event.target.dataset.filterKey;
      if (scope && key) {
        state.filters[scope][key] = event.target.value;
      }

      if (event.target.matches('input[name="assignee"]')) {
        document.querySelectorAll(".assign-person").forEach(person => {
          person.classList.toggle("selected", person.contains(event.target));
        });
      }

      if (event.target.dataset.action === "follow-type-select") {
        state.modal.followType = event.target.value;
        const fields = document.getElementById("followConvertFields");
        const required = event.target.value === "转商机";
        if (fields) fields.style.display = required ? "contents" : "none";
        const contentField = document.getElementById("followContentField");
        const content = document.getElementById("followContent");
        if (contentField) contentField.style.display = required ? "none" : "";
        if (content) content.required = !required;
        const returnField = document.getElementById("followReturnSeaField");
        if (returnField) returnField.style.display = event.target.value === "无合作意向" ? "" : "none";
        ["followContact", "followDemand", "followGroupBuilt", "followIntent"].forEach(id => {
          const field = document.getElementById(id);
          if (field) field.required = required;
        });
      }

      if (event.target.dataset.action === "toggle-edit-tag") {
        const tag = event.target.value;
        const context = event.target.dataset.editContext || "modal";
        const store = context === "detail" ? state.detailEdit : state.modal;
        const tags = store?.tags || [];
        store.tags = event.target.checked
          ? [...new Set([...tags, tag])]
          : tags.filter(item => item !== tag);
        const pickerId = context === "detail" ? "detailTagPicker" : "editTagPicker";
        const value = document.querySelector(`#${pickerId} .tag-picker-value`);
        if (value) value.textContent = store.tags.length ? store.tags.join("、") : "请选择标签";
      }

      if (event.target.dataset.action === "select-all") {
        selectAll(event.target.dataset.scope, event.target.checked);
      }
    });

    document.addEventListener("input", event => {
      const scope = event.target.dataset.filterScope;
      const key = event.target.dataset.filterKey;
      if (scope && key) state.filters[scope][key] = event.target.value;

      if (event.target.matches("#followContent")) {
        const count = event.target.value.length;
        const counter = document.getElementById("followCounter");
        if (counter) {
          counter.textContent = `${count}/2000`;
          counter.classList.toggle("limit", count >= 2000);
        }
      }

      if (event.target.dataset.action === "follow-search") {
        state.followSearch = event.target.value;
        renderDrawer();
        const input = document.querySelector('[data-action="follow-search"]');
        if (input) {
          input.focus();
          input.setSelectionRange(input.value.length, input.value.length);
        }
      }

      if (event.target.dataset.action === "assign-search") {
        const keyword = event.target.value.trim().toLowerCase();
        document.querySelectorAll(".assign-person").forEach(person => {
          person.style.display = person.dataset.assignSearchText.toLowerCase().includes(keyword) ? "" : "none";
        });
        document.querySelectorAll("[data-assign-team]").forEach(team => {
          team.style.display = [...team.querySelectorAll(".assign-person")].some(person => person.style.display !== "none") ? "" : "none";
        });
        document.querySelectorAll("[data-assign-region]").forEach(region => {
          region.style.display = [...region.querySelectorAll(".assign-person")].some(person => person.style.display !== "none") ? "" : "none";
        });
        const empty = document.getElementById("assignEmpty");
        if (empty) empty.style.display = keyword && [...document.querySelectorAll(".assign-person")].every(person => person.style.display === "none") ? "" : "none";
      }

      if (event.target.dataset.action === "tag-search") {
        const keyword = event.target.value.trim().toLowerCase();
        document.querySelectorAll(".tag-option").forEach(option => {
          option.style.display = option.dataset.tagText.toLowerCase().includes(keyword) ? "" : "none";
        });
      }
    });

    document.addEventListener("submit", event => {
      event.preventDefault();
      const scope = event.target.dataset.filterForm;
      if (scope) {
        submitFilter(scope);
        return;
      }
      if (event.target.id === "convertForm") submitConvert(event.target);
      if (event.target.id === "editForm") submitEdit(event.target);
      if (event.target.id === "newOppForm") submitNewOpportunity(event.target);
    });

    document.addEventListener("reset", event => {
      const scope = event.target.dataset.filterForm;
      if (scope) {
        window.setTimeout(() => resetFilters(scope, event.target), 0);
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        if (state.modal) closeModal();
        else if (state.drawer) closeDrawer();
        else if (state.columnPanelScope) {
          state.columnPanelScope = null;
          renderColumnPanel();
        }
      }
    });

    initRegionFilters();
    renderAll();
  </script>
</body>
</html>
